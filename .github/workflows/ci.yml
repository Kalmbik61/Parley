# CI (план релиза 0.1.0, V4): сборка, типы, линтер и юнит-тесты всех пакетов на каждый pull request и на
# каждый push в master. E2E окна здесь пока не гоняются — пункт в TODOS.
# Чужие действия — по полному SHA коммита, версия в комментарии (почему и как обновлять — в шапке release.yml).
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Новый коммит в PR отменяет устаревший прогон; прогоны master идут до конца.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Build, typecheck, lint, test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Версию pnpm action-setup берёт из `packageManager` корневого package.json: своей строки у него нет.
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      # Бинарь Electron этому CI не нужен: сборка, типы, линтер и юнит-тесты его не запускают (E2E в CI нет),
      # а скачивание около 100 МБ с GitHub — лишний повод для сбоя. Появятся E2E — убрать переменную.
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # `--retry=1`: тест, упавший один раз, гоняется ещё раз. Известные флейки хоста (TODOS, раздел 6) так
      # не блокируют PR, а настоящая поломка падает и во второй раз. `--no-bail`: упал один пакет — остальные
      # всё равно доходят до конца, и в журнале видны все поломки сразу.
      - name: Unit tests
        run: pnpm -r --workspace-concurrency=1 --no-bail run test --retry=1
