<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parley iOS MVP Prototype</title>
<!--
  D1 clickable prototype of the Parley iOS app, stage A (docs/design/2026-10-31-mobile-mvp-screens.md).
  Self-contained: inline CSS and JS, no network, not part of any build.
  SF Symbols are not available in a browser: the icons are simple SVG stand-ins; the real symbol name is in <title>.
-->
<style>
:root {
  --bg: #F2F2F7; --surface: #FFFFFF; --surface2: #F2F2F7;
  --label: #000000; --label2: rgba(60,60,67,.6); --label3: rgba(60,60,67,.3);
  --sep: rgba(60,60,67,.29);
  --tint: #A8531E; --onTint: #FFFFFF; --tintSoft: rgba(168,83,30,.12);
  --needs: #C93400; --needsDot: #FF9500; --needsSoft: rgba(255,149,0,.14);
  --idle: #8E8E93; --off: #C7C7CC; --ok: #248A3D; --danger: #D70015;
  --warnBg: #FFF4E5; --neutralBg: #E5E5EA;
  --glass: rgba(255,255,255,.72); --glassBorder: rgba(0,0,0,.08);
  --skel: #E3E3E8;
  --page: #D9D6D2; --panel: #FFFFFF; --panelText: #1d1d1f; --panelSub: #6e6e73;
  --fs: 1;
}
.dark {
  --bg: #000000; --surface: #1C1C1E; --surface2: #2C2C2E;
  --label: #FFFFFF; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
  --sep: rgba(84,84,88,.6);
  --tint: #E08A52; --onTint: #000000; --tintSoft: rgba(224,138,82,.18);
  --needs: #FF9F0A; --needsDot: #FF9F0A; --needsSoft: rgba(255,159,10,.18);
  --idle: #98989D; --off: #48484A; --ok: #30D158; --danger: #FF453A;
  --warnBg: #3A2A12; --neutralBg: #2C2C2E;
  --glass: rgba(30,30,32,.72); --glassBorder: rgba(255,255,255,.1);
  --skel: #2C2C2E;
}
html.pageDark { --page: #1b1a19; --panel: #262524; --panelText: #f2f2f2; --panelSub: #a1a1a6; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--panelText);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; }
.wrap { display: flex; gap: 32px; padding: 24px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }

/* ---------- control panel ---------- */
.panel { width: 320px; background: var(--panel); border-radius: 16px; padding: 16px 18px; font-size: 13px;
  box-shadow: 0 8px 30px rgba(0,0,0,.12); position: sticky; top: 24px; max-height: calc(100vh - 48px); overflow: auto; }
.panel h1 { font-size: 16px; margin: 0 0 2px; }
.panel p.sub { margin: 0 0 12px; color: var(--panelSub); }
.panel label { display: block; font-weight: 600; margin: 12px 0 4px; }
.panel select, .panel button { font: inherit; width: 100%; padding: 6px 8px; border-radius: 8px;
  border: 1px solid rgba(128,128,128,.35); background: transparent; color: inherit; }
.panel select option { color: #000; }
.panel .row { display: flex; gap: 6px; }
.panel .row > * { flex: 1; }
.panel button { cursor: pointer; margin-top: 6px; }
.panel button:hover { background: rgba(128,128,128,.12); }
.panel .seg { display: flex; border: 1px solid rgba(128,128,128,.35); border-radius: 8px; overflow: hidden; }
.panel .seg button { margin: 0; border: 0; border-radius: 0; }
.panel .seg button.on { background: #A8531E; color: #fff; }
.panel .hint { color: var(--panelSub); font-size: 12px; margin-top: 4px; }
.panel .flag { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-weight: 400; }
.panel .flag input { width: auto; }

/* ---------- phone ---------- */
.phone { width: 393px; height: 852px; border-radius: 55px; background: var(--bg); position: relative; overflow: hidden;
  box-shadow: 0 0 0 11px #1a1a1a, 0 0 0 13px #3a3a3a, 0 30px 60px rgba(0,0,0,.35); color: var(--label); flex: none; }
.status { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; justify-content: space-between;
  align-items: center; padding: 6px 34px 0 46px; font-weight: 600; font-size: 17px; z-index: 30; pointer-events: none; }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 125px; height: 37px;
  background: #000; border-radius: 20px; z-index: 31; }
.status .sicons { display: flex; gap: 6px; align-items: center; }
.homebar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 139px; height: 5px;
  border-radius: 3px; background: var(--label); opacity: .9; z-index: 40; pointer-events: none; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding-top: 54px; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 120px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }

/* typography (Dynamic Type) */
.t-large { font-size: calc(34px * var(--fs)); line-height: 1.2; font-weight: 700; letter-spacing: .2px; }
.t-title3 { font-size: calc(20px * var(--fs)); line-height: 1.25; font-weight: 600; }
.t-head { font-size: calc(17px * var(--fs)); line-height: 1.3; font-weight: 600; }
.t-body { font-size: calc(17px * var(--fs)); line-height: 1.3; }
.t-sub { font-size: calc(15px * var(--fs)); line-height: 1.33; }
.t-foot { font-size: calc(13px * var(--fs)); line-height: 1.38; }
.t-cap { font-size: calc(12px * var(--fs)); line-height: 1.33; }
.mono { font-family: "SF Mono", ui-monospace, Menlo, monospace; }
.l2 { color: var(--label2); } .l3 { color: var(--label3); }

/* nav bar */
.nav { padding: 0 16px; flex: none; }
.navrow { height: 44px; display: flex; align-items: center; justify-content: space-between; }
.navbtn { color: var(--tint); background: none; border: 0; font: inherit; font-size: calc(17px * var(--fs));
  display: flex; align-items: center; gap: 2px; cursor: pointer; padding: 0; min-height: 44px; }
.navbtn.glass { background: var(--glass); border: 1px solid var(--glassBorder); border-radius: 22px; padding: 0 12px;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); min-width: 44px; justify-content: center; }
.navtitle { padding: 2px 0 8px; }
.navsub { margin-top: -6px; padding-bottom: 8px; }

/* banner */
.banner { margin: 0 16px 8px; border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start;
  background: var(--neutralBg); animation: drop .32s cubic-bezier(.2,1.2,.4,1); cursor: pointer; }
.banner.warn { background: var(--warnBg); }
.banner .bt { flex: 1; }
.banner .bact { display: flex; gap: 14px; margin-top: 6px; }
.banner .bact button { background: none; border: 0; padding: 0; color: var(--tint); font: inherit; font-weight: 600; cursor: pointer; }
@keyframes drop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

/* grouped lists */
.sec { margin: 22px 16px 6px 32px; text-transform: uppercase; }
.group { margin: 0 16px; background: var(--surface); border-radius: 16px; overflow: hidden; }
.cell { display: flex; align-items: center; gap: 12px; padding: 11px 16px; min-height: 44px; position: relative; cursor: pointer; }
.cell + .cell::before { content: ""; position: absolute; top: 0; right: 0; left: 16px; border-top: .5px solid var(--sep); }
.cell.ind + .cell::before, .cell + .cell.ind::before { left: 52px; }
.cell .grow { flex: 1; min-width: 0; }
.cell .chev { color: var(--label3); flex: none; }
.cell.static { cursor: default; }
.cell.danger { color: var(--danger); justify-content: center; }
.cell .val { color: var(--label2); text-align: right; }
.ellips { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* cards */
.card { margin: 0 16px 12px; background: var(--surface); border-radius: 16px; padding: 14px 16px; cursor: pointer;
  transition: opacity .2s, transform .25s, max-height .25s, margin .25s, padding .25s; overflow: hidden; }
.card.static { cursor: default; }
.card .khead { display: flex; align-items: center; gap: 6px; color: var(--label2); }
.card .khead .kind { font-weight: 600; }
.card.needs .khead .kind { color: var(--needs); }
.card .who { margin-top: 6px; }
.code { background: var(--surface2); border-radius: 10px; padding: 8px 10px; margin-top: 10px; overflow-x: auto; white-space: pre; }
.code.clamp { white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.acts { display: flex; gap: 10px; margin-top: 12px; }
.acts.right { justify-content: flex-end; }
.link { color: var(--tint); font-weight: 600; display: inline-flex; align-items: center; gap: 2px; }
.note { margin-top: 10px; display: flex; gap: 6px; align-items: center; color: var(--label2); }
.note.ok { color: var(--ok); } .note.warn { color: var(--needs); }
.card.sending { opacity: .6; }
.card.leaving { opacity: 0; transform: scale(.97); max-height: 0 !important; padding-top: 0; padding-bottom: 0; margin-bottom: 0; }

/* buttons */
.btn { font: inherit; font-size: calc(17px * var(--fs)); font-weight: 600; border-radius: 14px; border: 0; cursor: pointer;
  min-height: 50px; padding: 0 16px; flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--tintSoft); color: var(--tint); }
.btn.sm { min-height: 40px; font-size: calc(15px * var(--fs)); border-radius: 12px; }
.btn.pri { background: var(--tint); color: var(--onTint); }
.btn.dangerText { color: var(--danger); background: transparent; }
.btn.plain { background: transparent; }
.btn:disabled { opacity: .38; cursor: default; }
.btn.full { width: 100%; flex: none; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2.4px solid currentColor; border-right-color: transparent;
  animation: rot .8s linear infinite; display: inline-block; flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }
.paused { text-align: center; margin: 0 0 8px; color: var(--label2); }

/* bottom action bar */
.bottombar { position: absolute; left: 0; right: 0; bottom: 92px; padding: 12px 16px; z-index: 18;
  background: var(--glass); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
  border-top: .5px solid var(--glassBorder); }
.bottombar.notabs { bottom: 0; padding-bottom: 34px; }
.bottombar .row { display: flex; gap: 12px; }
.bottombar .row + .row { margin-top: 10px; }
.rule { text-align: center; margin-top: 4px; }

/* tab bar (iOS 26 floating glass) */
.tabbar { position: absolute; left: 22px; right: 22px; bottom: 28px; height: 62px; border-radius: 31px; z-index: 20;
  display: flex; padding: 4px; background: var(--glass); border: 1px solid var(--glassBorder);
  backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8);
  box-shadow: 0 6px 24px rgba(0,0,0,.12); }
.tab { flex: 1; border: 0; background: none; color: var(--label); display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 2px; font: inherit; font-size: 10px; font-weight: 600; cursor: pointer; border-radius: 27px; position: relative; }
.tab.on { color: var(--tint); background: var(--tintSoft); }
.badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px; background: #FF3B30;
  color: #fff; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 10px; padding: 2px 8px; font-weight: 600; }
.pill.needs { background: var(--needsSoft); color: var(--needs); }
.pill.tint { background: var(--tintSoft); color: var(--tint); }
.pill.count { background: var(--needsDot); color: #fff; min-width: 22px; justify-content: center; }
.dark .pill.count { color: #000; }

/* status dots */
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.dot.needs { background: var(--needsDot); }
.dot.working { background: var(--tint); animation: pulse 1.6s ease-in-out infinite; }
.dot.unseen { border: 2px solid var(--tint); }
.dot.idle { background: var(--idle); }
.dot.off { border: 2px solid var(--off); }
@keyframes pulse { 50% { opacity: .35; } }

/* empty / centered states */
.center { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 72px 32px 0; gap: 10px; }
.center .big { color: var(--label2); margin-bottom: 6px; }
.center .btns { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }

/* skeleton */
.sk { background: var(--skel); border-radius: 8px; height: 14px; margin: 8px 0; animation: shimmer 1.2s ease-in-out infinite alternate; }
@keyframes shimmer { from { opacity: .4; } to { opacity: .8; } }

/* question options */
.opt { display: flex; gap: 12px; align-items: flex-start; }
.opt .mark { color: var(--tint); width: 22px; flex: none; }
.field { width: 100%; font: inherit; font-size: calc(17px * var(--fs)); background: var(--surface); color: var(--label);
  border: 0; border-radius: 12px; padding: 12px 14px; outline: none; }
textarea.field { min-height: 160px; resize: none; }

/* markdown */
.md p { margin: 0 0 8px; } .md h3 { margin: 4px 0 8px; font-size: calc(17px * var(--fs)); }
.md ul { margin: 0 0 8px; padding-left: 20px; } .md li { margin: 2px 0; }
.md a { color: var(--tint); }
.md code { font-family: "SF Mono", ui-monospace, Menlo, monospace; background: var(--surface2); border-radius: 5px; padding: 1px 4px; font-size: .88em; }
.md .noimg { display: flex; gap: 6px; align-items: center; color: var(--label2); background: var(--surface2); border-radius: 10px; padding: 8px 10px; margin: 6px 0; }

/* sheet, alert, toast */
.dim { position: absolute; inset: 0; background: rgba(0,0,0,.35); z-index: 50; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 380px; background: var(--bg); z-index: 51;
  border-radius: 38px 38px 0 0; padding: 8px 16px 34px; animation: up .35s cubic-bezier(.2,1.1,.4,1); display: flex; flex-direction: column; }
.sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--label3); margin: 0 auto 8px; }
@keyframes up { from { transform: translateY(100%); } }
.alert { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 270px; z-index: 52;
  background: var(--glass); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-radius: 22px; overflow: hidden;
  text-align: center; animation: pop .25s cubic-bezier(.2,1.3,.4,1); }
.dark .alert { background: rgba(44,44,46,.92); }
@keyframes pop { from { transform: translate(-50%,-50%) scale(1.12); opacity: 0; } }
.alert .ab { padding: 18px 16px 14px; }
.alert .abtns { display: flex; border-top: .5px solid var(--sep); }
.alert .abtns button { flex: 1; min-height: 44px; border: 0; background: none; font: inherit; font-size: 17px; color: var(--tint); cursor: pointer; }
.alert .abtns button + button { border-left: .5px solid var(--sep); }
.alert .abtns button.destr { color: var(--danger); font-weight: 600; }
.toast { position: absolute; top: 62px; left: 50%; transform: translateX(-50%); z-index: 45; background: var(--glass);
  border: 1px solid var(--glassBorder); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-radius: 22px; padding: 10px 16px; font-weight: 600; font-size: 15px; display: flex; gap: 8px; align-items: center;
  box-shadow: 0 8px 24px rgba(0,0,0,.15); animation: drop .3s; white-space: nowrap; }
.haptic { position: absolute; right: 18px; top: 120px; z-index: 46; background: #5E5CE6; color: #fff; border-radius: 8px;
  padding: 3px 8px; font-size: 11px; font-weight: 700; font-family: ui-monospace, Menlo, monospace; animation: buzz .3s; }
@keyframes buzz { 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }

/* camera */
.cam { position: absolute; inset: 0; background: radial-gradient(ellipse at 40% 30%, #4a4a4a, #111 70%); z-index: 1; }
.viewfinder { position: absolute; left: 50%; top: 300px; transform: translateX(-50%); width: 260px; height: 260px; border-radius: 24px;
  box-shadow: 0 0 0 999px rgba(0,0,0,.45); border: 3px solid rgba(255,255,255,.9); z-index: 2; display: flex; align-items: center; justify-content: center; }
.viewfinder.hit { border-color: var(--tint); }
.fakeqr { width: 150px; height: 150px; opacity: .85; background:
  repeating-conic-gradient(#fff 0 25%, #222 0 50%) 0 0/30px 30px; border-radius: 6px; }
.camtext { position: absolute; left: 0; right: 0; top: 580px; text-align: center; color: #fff; z-index: 3; }
.camtop { position: absolute; top: 60px; left: 16px; right: 16px; display: flex; justify-content: space-between; z-index: 3; }
.camtop .navbtn { color: #fff; }

.sas { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: calc(48px * var(--fs)); font-weight: 600;
  letter-spacing: 2px; font-variant-numeric: tabular-nums; margin: 12px 0; }
.sas.late { color: var(--needs); }
.sas .gap { display: inline-block; width: 18px; }

/* reduce motion */
.rm *, .rm *::before { animation: none !important; transition: opacity .15s !important; }

/* accessibility sizes: vertical layout */
.ax .acts, .ax .bottombar .row { flex-direction: column-reverse; }
.ax .cell { flex-wrap: wrap; }
.ax .cell .val, .ax .cell .trail { width: 100%; text-align: left; }
.ic { flex: none; display: inline-block; vertical-align: middle; }

/* works grouped by project */
.projhead { display: flex; align-items: center; gap: 6px; text-transform: none; font-weight: 600; color: var(--label); margin-left: 20px; }
.projhead .l3 { font-weight: 400; }
.pdot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; margin-right: 4px; vertical-align: middle; }
.star { color: var(--tint); font-size: .8em; }
.mdots { display: flex; gap: 4px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
.mdots .dot { width: 8px; height: 8px; }
.mdots .t-foot { margin-left: 4px; }
.mini { display: inline-flex; }

/* teams: the main session with everything it runs (sessions it created, rooms it owns, swarms it started) */
:root { --line: rgba(60,60,67,.30); }
.dark { --line: rgba(235,235,245,.26); }
.teamcard { margin: 0 16px 12px; background: var(--surface); border-radius: 16px; overflow: hidden; }
.trow { position: relative; display: flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer;
  padding: 10px 12px 10px calc(16px + var(--d) * 28px); }
.trow + .trow::before, .teamcard > * + .cell::before { content: ""; position: absolute; top: 0; right: 0; left: calc(16px + var(--d, 0) * 28px + 44px); border-top: .5px solid var(--sep); }
.teamcard > .cell { position: relative; }
.teamcard > .cell + .cell::before { left: 16px; }
.trow.bubblerow { cursor: default; padding-top: 6px; padding-bottom: 6px; }
.trow.bubblerow + .trow::before, .trow + .trow.bubblerow::before { display: none; }
.trow .grow, .mrow .grow, .bhead .grow { flex: 1; min-width: 0; }
.trow .chev, .mrow .chev, .bhead .chev { color: var(--label3); flex: none; }
.ibox { width: 36px; flex: none; display: flex; justify-content: center; align-items: center; }
.ibox.sm { width: 24px; }
.g { position: absolute; pointer-events: none; border-left: 1.5px solid var(--line); margin-left: -.75px; }
.g.pass { top: 0; bottom: 0; }
.g.start { top: calc(50% + 13px); bottom: 0; }
.g.start.head { top: calc(50% + 21px); }
.g.elbow { top: 0; height: 50%; border-bottom: 1.5px solid var(--line); border-bottom-left-radius: 10px; }
.bubblerow .g.elbow { height: 32px; }
.bubblerow .g.start { top: 52px; }
.bubble { flex: 1; min-width: 0; border-radius: 14px; background: var(--surface2); overflow: hidden; }
.dark .bubble { background: #242426; }
.bubble.dec { background: var(--tintSoft); box-shadow: inset 0 0 0 1px rgba(168,83,30,.25); }
.dark .bubble.dec { box-shadow: inset 0 0 0 1px rgba(224,138,82,.3); }
.bhead { display: flex; gap: 8px; align-items: center; padding: 10px 10px 10px 12px; cursor: pointer; }
.bicon { display: flex; width: 22px; justify-content: center; flex: none; }
.mrow { display: flex; gap: 6px; align-items: center; padding: 8px 10px 8px 10px; border-top: .5px solid var(--sep); cursor: pointer; }
.rolechip { display: inline-block; border-radius: 6px; padding: 0 5px; margin-right: 6px; background: var(--tintSoft); color: var(--tint); font-weight: 600; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--tint); color: var(--onTint); display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 16px; position: relative; }
.avatar .abadge { position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface);
  display: flex; align-items: center; justify-content: center; }
.avatar .abadge .dot { width: 8px; height: 8px; }
.trow.thead { padding-top: 14px; padding-bottom: 14px; }
.teamline { display: flex; align-items: center; gap: 4px; margin-top: 4px; color: var(--tint); font-weight: 600; }
.tgl { border: 0; background: none; color: var(--label3); width: 44px; height: 44px; margin: -10px -8px -10px 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.morelink { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; color: var(--tint); font-weight: 600; }
.comb { display: block; }
/* Face ID / passcode (system UI stand-ins) */
.btn .ic { margin-right: -2px; }
.faceid { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 160px; height: 160px; border-radius: 30px; z-index: 53;

  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, function (_, label, url) {

}
function md(src) {

    const img = line.match(/^!\[[^\]]*\]\((https?:\/\/([^/)\s]+)[^)\s]*)\)$/);
    if (/^- /.test(line)) { if (!list) { out.push('<ul>'); list = true; } out.push('<li>' + inline(line.slice(2)) + '</li>'); return; }

  ['Pairing: Scanner — not a Parley code', function () { startFlow('badqr'); }],
  ['Pairing: Camera access is off', function () { startFlow('camDenied'); }],
  ['Pairing: Confirm parley:// link', function () { startFlow('confirmLink'); }],
  ['Pairing: Device name', function () { startFlow('name'); }],
  ['Pairing: Connecting', function () { startFlow('handshake'); }],
  ['Pairing: SAS code', function () { startFlow('sas'); S.sasLeft = 114; tick(); }],
  ['Pairing: SAS — last 10 s', function () { startFlow('sas'); S.sasLeft = 9; tick(); }],
  ['Pairing: Denied', function () { startFlow('denied'); }],
  ['Pairing: Timeout', function () { startFlow('timeout'); }],
  ['Pairing: Code already used', function () { startFlow('offerClosed'); }],
  ['Pairing: Relay unreachable', function () { startFlow('relayFail'); }],
  ['Pairing: Paired', function () { startFlow('paired'); }],
  ['Pairing: Notifications prompt', function () { startFlow('notif'); }],
  ['Inbox', function () { go('inbox', []); }],
  ['Session: permission + Always', function () { go('inbox', [{ s: 'session', id: 's-176' }]); }],
  ['Session: permission, no Always', function () { go('inbox', [{ s: 'session', id: 's-05' }]); }],
  ['Session: question', function () { go('inbox', [{ s: 'session', id: 's-175' }]); }],
  ['Session: plan', function () { go('inbox', [{ s: 'session', id: 's-181' }]); }],
  ['Session: Answer at your Mac', function () { go('inbox', [{ s: 'session', id: 's-190' }]); }],
  ['Session: usage limit', function () { go('inbox', [{ s: 'session', id: 's-191' }]); }],
  ['Session: working, no card', function () { go('works', [{ s: 'work', id: 'w1' }, { s: 'session', id: 's-177' }]); }],
  ['Session: done', function () { go('works', [{ s: 'work', id: 'w1' }, { s: 'session', id: 's-09' }]); }],
  ['Decision', function () { go('inbox', [{ s: 'decision', id: 'd1' }]); }],
  ['Decision: Return for rework sheet', function () { go('inbox', [{ s: 'decision', id: 'd1' }]); DECISIONS.d1 && (S.dec.d1 = S.dec.d1 || { rev: 2, conflict: false, result: null, note: '' }); S.sheet = { kind: 'return', id: 'd1' }; }],
  ['Decision: conflict', function () { go('inbox', [{ s: 'decision', id: 'd1' }]); S.dec.d1 = { rev: 3, conflict: true, result: null, note: '' }; }],
  ['Letters', function () { go('inbox', [{ s: 'letters' }]); }],
  ['Letter', function () { go('inbox', [{ s: 'letters' }, { s: 'letter', id: 'l1' }]); }],
  ['Works', function () { go('works', []); }],
  ['Work: teams, rooms, swarm, tree', function () { go('works', [{ s: 'work', id: 'w1' }]); }],
  ['Work: tree without rooms', function () { go('works', [{ s: 'work', id: 'w2' }]); }],
  ['Work: owner with a room (Rooms organic)', function () { go('works', [{ s: 'work', id: 'w3' }]); }],
  ['Session: main session with its team (Greta)', function () { go('works', [{ s: 'work', id: 'w1' }, { s: 'session', id: 's-11' }]); }],
  ['Session: swarm drone (breadcrumb)', function () { go('works', [{ s: 'work', id: 'w1' }, { s: 'session', id: 's-204' }]); }],
  ['Settings', function () { go('settings', []); }],
  ['Settings: Host', function () { go('settings', [{ s: 'host', i: 0 }]); }],
  ['Settings: Remove alert', function () { go('settings', [{ s: 'host', i: 0 }]); S.alert = { title: 'Remove ' + HOSTS[0].name + '?', text: 'The keys on this phone are erased. Your Mac keeps listing this phone until you revoke it there.', ok: 'Remove', destr: true, i: 0 }; }],
  ['Settings: Diagnostics', function () { go('settings', [{ s: 'diag' }]); }],
  ['Face ID: Allow on Session (prompt)', function () { go('inbox', [{ s: 'session', id: 's-176' }]); S.nextAuth = 'success'; S.auth = { stage: 'scan', reason: 'allow', proceed: function () {}, digits: 0 }; }],
  ['Face ID: not recognized (alert)', function () { go('inbox', [{ s: 'session', id: 's-176' }]); S.auth = { stage: 'failed', reason: 'allow', proceed: function () {}, digits: 0 }; }],
  ['Face ID: passcode fallback', function () { go('inbox', [{ s: 'decision', id: 'd1' }]); S.auth = { stage: 'passcode', reason: 'accept', proceed: function () {}, digits: 2 }; }],
  ['Settings: Require Face ID to allow', function () { go('settings', []); }],
  ['Settings: Choose a Mac menu', function () { go('inbox', []); S.sheet = { kind: 'hosts' }; }],
];
function go(tab, rest) { S.flow = null; if (S.hostCount === 0) S.hostCount = 1; S.tab = tab; S.stacks[tab] = [S.stacks[tab][0]].concat(rest); S.sheet = null; S.alert = null; S.scrollTop = 0; }
const CONN = [['ready', 'Ready (no banner)'], ['cold', 'Cold start: Connecting…'], ['updating', 'Reconnecting: Updating…'], ['waiting', 'Backoff: Retrying in…'],
  ['offline', 'No internet connection'], ['relay', "Can't reach relay"], ['macOffline', 'Mac offline (relay host_offline)'], ['starting', 'Mac is starting…'],
  ['hostDown', "Parley isn't running on your Mac"], ['unknown', 'This Mac does not recognize this phone'], ['revoked', 'Removed from this Mac (revoked / reset)'],
  ['updatePhone', 'Update required (phone)'], ['updateMac', 'Update Parley on your Mac']];
function opt(list, cur) { return list.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === cur ? ' selected' : '') + '>' + h(o[1]) + '</option>'; }).join(''); }
function seg(name, list, cur) { return '<div class="seg">' + list.map(function (o) { return '<button data-p="' + name + '" data-v="' + o[0] + '" class="' + (String(o[0]) === String(cur) ? 'on' : '') + '">' + o[1] + '</button>'; }).join('') + '</div>'; }
function renderPanel() {
  const p = document.getElementById('panel');
  const focused = document.activeElement && p.contains(document.activeElement) ? document.activeElement.id : null;
  p.innerHTML = '<h1>Parley iOS — stage A</h1><p class="sub">D1 prototype. Click through the phone; switch states here.</p>' +
    '<label>Theme</label>' + seg('theme', [['light', 'Light'], ['dark', 'Dark'], ['system', 'System']], S.theme) +
    '<label for="pConn">Connection</label><select id="pConn">' + opt(CONN, S.conn) + '</select>' +
    '<label>Data</label>' + seg('scenario', [['normal', 'Normal'], ['empty', 'Empty'], ['loading', 'Loading'], ['error', 'Error']], S.scenario) +
    '<label>Text size (Dynamic Type)</label>' + seg('fs', [[1, 'Default'], [1.24, 'XXL'], [1.65, 'AX3']], S.fs) +
    '<label class="flag"><input type="checkbox" id="pRm"' + (S.rm ? ' checked' : '') + '> Reduce Motion</label>' +
    '<label>Work screen hierarchy</label>' + seg('hier', [['cards', 'Team cards'], ['lines', 'Tree lines only']], S.hier) +
    '<label>Paired Macs</label>' + seg('hostCount', [[1, 'One'], [2, 'Two']], S.hostCount) +
    '<label>Approvals (decision 6)</label>' + seg('bio', [['faceid', 'Face ID'], ['none', 'Not enrolled → passcode']], S.bio) +
    '<div style="height:6px"></div>' + seg('nextAuth', [['success', 'Next: success'], ['cancel', 'Cancel'], ['fail', 'Fail']], S.nextAuth) +
    '<div style="height:6px"></div>' + seg('faceIdReq', [['on', 'Require on'], ['off', 'Off']], S.faceIdReq) +
    '<label>Notifications</label>' + seg('notif', [['on', 'On'], ['denied', 'Off in iOS'], ['unavailable', 'No push build']], S.notif) +
    '<label for="pNext">Next answer result</label><select id="pNext">' + opt([['applied', 'applied: true'], ['already', 'applied: false (already answered)'], ['lost', 'connection_lost → re-read'], ['conflict', 'conflict (decisions only)']], S.next) + '</select>' +
    '<button id="pAnsweredMac">Simulate: answered at your Mac</button>' +
    '<button id="pSwarm">Simulate: next drone hands in</button>' +
    (S.flow === 'sas' ? '<label>Mac answers</label><div class="row"><button data-mac="paired">Allow</button><button data-mac="denied">Deny</button></div><div class="row"><button data-mac="timeout">Timeout</button><button data-mac="offerClosed">Code used</button></div>' : '') +
    '<label for="pJump">Go to screen</label><select id="pJump"><option value="">— choose —</option>' + JUMPS.map(function (j, i) { return '<option value="' + i + '">' + h(j[0]) + '</option>'; }).join('') + '</select>' +
    '<div class="hint">Haptics show as a purple “haptic:” tag on the phone. SF Symbols are SVG stand-ins; hover an icon for the symbol name.</div>' +
    '<button id="pReset">Reset prototype</button>';
  if (focused) { const f = document.getElementById(focused); if (f) f.focus(); }
}
document.getElementById('panel').addEventListener('click', function (e) {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.p) { const v = b.dataset.v; const k = b.dataset.p; S[k] = (k === 'fs' || k === 'hostCount') ? +v : v; if (k === 'hostCount' && S.cur >= S.hostCount) S.cur = 0; render(); return; }
  if (b.dataset.mac) { const r = b.dataset.mac; clearFlowTimers(); S.flow = r; haptic(r === 'paired' ? 'success' : 'warning'); render(); return; }
  if (b.id === 'pAnsweredMac') {
    const r = topRoute();
    let id = null;
    if (!S.flow && r.s === 'session') { const s = findSession(r.id).s; if (s.card && !S.gone[s.card]) id = s.card; }
    if (!S.flow && r.s === 'decision') { const ds = S.dec[r.id] || (S.dec[r.id] = { rev: 2, conflict: false, result: null, note: '' }); ds.result = 'answered'; render(); return; }
    if (!id) { const it = inboxItems().find(function (x) { return x.type === 'card'; }); if (it) id = it.id; }
    if (id) { S.itemState[id] = 'answeredMac'; later(2000, function () { S.itemState[id] = 'leaving'; }); later(2300, function () { S.gone[id] = true; S.itemState[id] = undefined; }); }
    render(); return;
  }
  if (b.id === 'pSwarm') { swarmStep(); render(); return; }
  if (b.id === 'pReset') { location.reload(); }
});
document.getElementById('panel').addEventListener('change', function (e) {
  const t = e.target;
  if (t.id === 'pConn') { S.conn = t.value; if (S.conn === 'waiting') S.retryIn = 12; }
  if (t.id === 'pNext') S.next = t.value;
  if (t.id === 'pRm') S.rm = t.checked;
  if (t.id === 'pJump' && t.value !== '') JUMPS[+t.value][1]();
  render();
});
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (S.theme === 'system') render(); });
render();
