# Раздаваемая сборка macOS (план релиза 0.1.0, V2): dmg и zip под arm64 и x64, подпись ad-hoc, без
# сертификата Apple и нотаризации. Без подписи Apple автообновления на macOS нет — окно только
# сообщает о новой версии. `appId` после первого публичного релиза не менять: пропадут настройки
# и разрешения macOS, выданные приложению.
# Быстрая локальная сборка — только .app этой машины, без dmg и zip: `pnpm --filter @parley/desktop dist --dir`.
appId: dev.parley.desktop
productName: Parley
directories:
  output: dist
# electron-vite (`pnpm build`) кладёт готовые бандлы в out/main, out/preload,
# out/renderer — их и упаковываем. `out/host` (см. `dist` в package.json)
# едет отдельно через extraResources, а не через node_modules приложения.
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
  - '!node_modules/@parley/host/**'
  - '!node_modules/node-pty/**'
  - '!node_modules/.pnpm/@parley+host@**'
  - '!node_modules/.pnpm/node-pty@**'
# node-pty хоста собран под системный Node (спека §3.2) — Electron его вообще
# не грузит, поэтому пересобирать нативные модули под ABI Electron незачем.
npmRebuild: false
extraResources:
  - from: out/host
    to: host
  # `createFilter` в electron-builder жёстко режет каталог `node_modules`,
  # когда он лежит прямо на верхнем уровне копируемого `from` (сравнение
  # строкой "node_modules" — https://github.com/electron-userland/electron-builder/issues,
  # это касается «мёртвый node_modules у корня» независимо от `filter`).
  # Обходим тем же приёмом, что и остальные: копируем node_modules хоста
  # отдельной записью, где он уже не верхний уровень своего `from`.
  - from: out/host/node_modules
    to: host/node_modules
  # NOTICE и лицензии шрифтов Figtree и Caprasimo — в Contents/Resources (ревью M7): MIT Orca и
  # shadcn/ui требует уведомления в копиях, OFL — текста лицензии рядом со шрифтом, а `files` берёт
  # только out/** и package.json.
  - from: ../../NOTICE
    to: NOTICE
  - from: src/renderer/assets/fonts/Figtree-OFL.txt
    to: licenses/Figtree-OFL.txt
  - from: src/renderer/assets/fonts/Caprasimo-OFL.txt
    to: licenses/Caprasimo-OFL.txt
  # Встроенный Node 22: `scripts/fetch-node.mjs` кладёт его в build/node/darwin-<arch>/bin/node, сюда он
  # попадает как Contents/Resources/node/bin/node — окно запускает им хост (`src/main/host-launcher.ts`),
  # и человеку свой node не нужен. Рядом едет LICENSE из архива Node (Contents/Resources/node/LICENSE): бинарь
  # раздаётся вместе с текстом лицензии. `${arch}` — архитектура собираемой цели. Нет каталога (сборка без
  # `fetch-node`, например локальный `dist`) — electron-builder только предупреждает, а окно берёт node из PATH.
  - from: build/node/darwin-${arch}
    to: node
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Ad-hoc подпись (`-`), а не её отсутствие: скачанный без подписи arm64 `.app` macOS называет повреждённым.
  # Hardened runtime без сертификата Apple не нужен, а с ad-hoc он требует лишних entitlements.
  identity: '-'
  hardenedRuntime: false
  # Один шаблон для dmg и zip, без версии: так работают ссылки `releases/latest/download/<имя>`.
  artifactName: parley-macos-${arch}.${ext}
# Черновик: релиз становится публичным только после проверки, что все файлы на месте (release.yml).
publish:
  provider: github
  owner: Kalmbik61
  repo: Parley
  releaseType: draft
